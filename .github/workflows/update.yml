name: Update AA leaderboard ranking

on:
  schedule:
    # 每月 1 日与 16 日 06:00 UTC（约 14:00 北京时间），即每 15 天一轮。
    # 上游 LiveBench/AA 都是按月出新 release，月度节奏会让榜单最多旧一个月；
    # 改半月可把最长滞后压到 15 天。
    - cron: "0 6 1,16 * *"
  workflow_dispatch: {}
permissions:
  contents: write
  issues: write
jobs:
  update:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq fonts-noto-cjk
          pip install -r requirements.txt

      - name: Run unit tests (quality gate)
        run: python -m pytest -q

      - name: Fetch, score, refresh README
        run: python scripts/build.py

      - name: Commit & push if changed
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "chore: auto-update leaderboard ranking"
          # model_registry.json 必须一起提交：--apply 自动入池的新模型只存在
          # 于 runner 的临时工作区，不落盘就无法审计，下轮还会重复入池。
          file_pattern: "results/*.csv results/*.json results/manifest.json results/*.svg README.md scripts/model_registry.json scripts/official_evals.json"
          commit_author: "github-actions[bot] <github-actions[bot]@users.noreply.github.com>"

      # 用 actions/github-script 替代原 dacbd/create-issue-action@v2：
      # 后者最后一次提交停留在 2024-04，只跑 node20，无 Node 24 版本。
      # （更早的 peter-evans/create-or-update-issue-action@v3 在本仓库解析失败，
      # 报 repository not found，故不走那条线。）
      # run_attempt == 1：重试不再重复开 issue。
      - name: Alert on failure
        if: failure() && github.run_attempt == 1
        uses: actions/github-script@v8
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: "⚠ 月度排名更新失败",
              body: [
                "自动排名流水线失败。",
                "可能原因：AA 页面结构变更、数据源异常、网络超时。",
                "请检查 Actions 日志。",
              ].join("\n"),
            });
